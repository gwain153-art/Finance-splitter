<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../css/fonts.css">
<style>body{margin:0;padding:20px;background:#09090C;display:grid;gap:18px}.n{width:480px;aspect-ratio:480/256;border-radius:14px;overflow:hidden;box-shadow:0 20px 40px #000}.n svg{width:100%;height:100%;display:block}.row{display:flex;gap:10px}.m{width:90px;aspect-ratio:480/256}.m svg{width:100%;height:100%}</style></head>
<body><div class="n" id="a"></div><div class="n" id="b"></div><div class="n" id="h"></div><div class="row" id="m"></div>
<script type="module">
import { noteSVG, miniSprite } from '../js/banknote.js';
a.innerHTML = noteSVG('50', { value: '£2,400' });
b.innerHTML = noteSVG('20');
h.innerHTML = noteSVG('50', { hero: true });
document.body.insertAdjacentHTML('beforeend', miniSprite());
m.innerHTML = ['50','50','20','20'].map(d => `<div class="m"><svg><use href="#bn-mini-${d}"/></svg></div>`).join('');
</script></body></html>
