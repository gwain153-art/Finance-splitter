<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BG Test Bench</title>
<style>
:root{color-scheme:dark;--black:#0A0708;--panel:#171113;--line:#2F2529;--line-2:#46383E;--text:#F4ECEE;--crimson:#DC143C;--crimson-hi:#FF3A5C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--black);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block}
.ui{position:relative;z-index:1;padding:16px;max-width:460px;margin:0 auto;display:grid;gap:14px;pointer-events:none}
.card{pointer-events:auto;background:rgba(23,17,19,.55);border:1px solid rgba(70,56,62,.6);border-radius:18px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h1{margin:0 0 4px;font-size:28px;letter-spacing:.02em}
p{margin:0;color:#9C8E93;font-size:14px}
.big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--text);background:#211A1D;border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;cursor:pointer}
button.on{background:var(--crimson);border-color:var(--crimson-hi)}
input[type=range]{width:100%;accent-color:var(--crimson)}
.stat{font:12px ui-monospace,monospace;color:#9C8E93}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="ui">
  <div class="card">
    <h1>Clean Cut</h1>
    <p>Background bench. Click anywhere on the background to pulse. Move the mouse to tilt.</p>
    <div class="big">$2,480.00</div>
  </div>
  <div class="card">
    <div class="row" id="moods">
      <button data-mood="idle" class="on">idle</button>
      <button data-mood="charging">charging</button>
      <button data-mood="over">over</button>
      <button data-mood="celebrate">celebrate</button>
    </div>
    <p style="margin-top:12px">Charge <span id="cv">0.00</span></p>
    <input id="charge" type="range" min="0" max="1" step="0.01" value="0">
    <div class="row" style="margin-top:8px">
      <button id="burst">4 pulses</button>
      <button id="rm">reload reduceMotion</button>
    </div>
    <p class="stat" id="stat"></p>
  </div>
</div>
<script type="module">
import { createBackground } from '../js/bg.js';
const qs = new URLSearchParams(location.search);
const canvas = document.getElementById('bg');
const bg = createBackground(canvas, { reduceMotion: qs.has('rm') });
window.bg = bg;
const stat = document.getElementById('stat');
stat.textContent = `ok=${bg.ok} internal=${canvas.width}x${canvas.height} reduceMotion=${qs.has('rm')}`;

const moods = document.getElementById('moods');
moods.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  moods.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  bg.setMood(b.dataset.mood);
});
const charge = document.getElementById('charge');
charge.addEventListener('input', () => {
  document.getElementById('cv').textContent = (+charge.value).toFixed(2);
  bg.setCharge(+charge.value);
});
document.getElementById('burst').addEventListener('click', () => {
  const W = innerWidth, H = innerHeight;
  [[.2,.3],[.8,.4],[.3,.8],[.7,.75]].forEach(([x,y], i) => setTimeout(() => bg.pulse(x*W, y*H, 1), i*120));
});
document.getElementById('rm').addEventListener('click', () => {
  location.search = qs.has('rm') ? '' : '?rm';
});
window.addEventListener('pointerdown', e => {
  if (e.target.closest('.card')) return;
  bg.pulse(e.clientX, e.clientY, 1);
});
window.addEventListener('pointermove', e => {
  bg.setTilt(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1);
});
setInterval(() => {
  stat.textContent = `ok=${bg.ok} internal=${canvas.width}x${canvas.height} reduceMotion=${qs.has('rm')}`;
}, 1000);
</script>
</body>
</html>
